<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Biblioteca — Consello da Abogacía Galega</title>
  <link rel="stylesheet" href="library.css">
</head>
<body>
  <header class="library-header"><div><h1>Biblioteca</h1><p>Consello da Abogacía Galega</p></div><div class="reader-tools" role="group" aria-label="Tamaño del texto"><button id="readerSmaller" aria-label="Reducir texto">A−</button><button id="readerLarger" aria-label="Ampliar texto">A+</button></div></header>
  <div class="library-layout">
    <aside aria-label="Navegar por la biblioteca">
      <label for="librarySearch">Buscar en la biblioteca</label>
      <input id="librarySearch" type="search" placeholder="Nombre o contenido…">
      <div id="libraryList"></div>
      <p class="sidebar-hint">Los elementos se actualizan al subirlos o recogerlos desde el panel lateral.</p>
    </aside>
    <main id="reader" aria-label="Contenido del elemento seleccionado">
      <div id="readerEmpty"><h2>Tu biblioteca, en grande</h2><p>Selecciona un prompt, documento o resolución en la lista para leer su contenido.</p></div>
      <article id="readerArticle" hidden>
        <p id="readerType" class="eyebrow"></p><h2 id="readerTitle" tabindex="-1"></h2><p id="readerMeta" class="metadata"></p>
        <div class="reader-actions"><button id="readerCopy">Copiar texto</button><a id="readerSource" target="_blank" rel="noopener noreferrer" hidden>Abrir en CENDOJ</a><label id="readerAttachLabel" class="attach-button" hidden>Adjuntar texto íntegro<input id="readerAttach" type="file" accept=".pdf,.txt,.md,.docx" hidden></label></div>
        <p id="readerNotice" role="status"></p>
        <div id="readerText" class="reading-text"></div>
      </article>
      <p id="libraryStatus" role="status" aria-live="polite"></p>
    </main>
  </div>
  <script src="libs/pdf.min.js"></script><script src="libs/mammoth.browser.min.js"></script>
  <script src="shared.js"></script><script src="documents.js"></script><script src="library.js"></script>
</body>
</html>
